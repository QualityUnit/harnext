name: Publish Python SDK

# Releases the harnext Python SDK (sdk/python) to PyPI via OIDC trusted
# publishing — no API token stored in the repo. Triggered by pushing a
# `python-v*` tag (kept separate from the npm CLI's `v*` tags), or manually
# (defaulting to TestPyPI for a safe dry run).
#
# One-time setup: create a "pending publisher" on PyPI (and TestPyPI) for the
# project `harnext-sdk`, owner `QualityUnit`, repo `harnext`, workflow
# `publish-python-sdk.yml`. See:
# https://docs.pypi.org/trusted-publishers/adding-a-publisher/

on:
  push:
    tags: ['python-v*']
  workflow_dispatch:
    inputs:
      repository:
        description: 'Index to publish to'
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

defaults:
  run:
    working-directory: sdk/python

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package + tooling
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-sdk-dist
          path: sdk/python/dist/*

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-sdk-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-sdk-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
