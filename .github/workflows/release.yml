name: Release

# A `v<version>` tag releases BOTH artifacts from the same version:
#   - the harnext CLI  -> npm   (token auth via NPM_TOKEN)
#   - the harnext SDK  -> PyPI  (OIDC trusted publishing; project `harnext`)
#
# The Python SDK version is derived from the tag so the CLI and SDK stay in
# lockstep (tag `v1.3.3` -> npm 1.3.3 + harnext==1.3.3 on PyPI).
#
# workflow_dispatch (dry_run=true, the default) builds and validates both
# without uploading.
#
# PyPI trusted publisher must reference workflow `release.yml`
# (project `harnext`, owner `QualityUnit`, repo `harnext`, environment blank).
# See https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build/validate only (no npm or PyPI upload)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Publish CLI to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish CLI
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --dry-run
          else
            npm publish
          fi

  build-python:
    name: Build & check Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync version from tag
        if: github.event_name == 'push'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing Python SDK version $VERSION"
          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i -E "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" harnext_sdk/__init__.py

      - name: Install package + tooling
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-sdk-dist
          path: sdk/python/dist/*

  publish-pypi:
    name: Publish SDK to PyPI
    needs: build-python
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-sdk-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
